<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      // Local Vite testing: remove stale PWA shells before React starts.
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.endsWith('.e2b.app')) {
        if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
        if ('caches' in window) caches.keys().then(keys => keys.filter(k => k.startsWith('dairyfarm-')).forEach(k => caches.delete(k))).catch(() => {});
      }
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Usman Dairy Farm</title>
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Usman Dairy Farm" />
    <link rel="icon" href="/favicon.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/dairy-farm-logo-round-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <!-- muf-applike splash — removed by hideMufSplash() once the app mounts -->
    <div id="muf-splash"><img src="/dairy-farm-logo-round-192.png" alt="" /><p>Usman Dairy Farm</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
