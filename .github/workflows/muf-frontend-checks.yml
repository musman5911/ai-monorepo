name: MUF frontend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muf-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regressions:
    name: Root tests and source guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dairy_farm/client/package-lock.json
            flock_farm/client/package-lock.json
            agri_farm/frontend/package-lock.json

      - name: Install root test tools
        run: npm ci

      - name: Install Dairy frontend dependencies used by root tests
        working-directory: dairy_farm/client
        run: npm ci

      - name: Run root regression tests
        run: npm test

      - name: Check shared MUF parity
        run: node tools/check-muf-sync.js

      - name: Check UI safety
        run: node tools/check-ui-safety.js

      - name: Check workbench source safety
        run: npm run check-workbench

      - name: Check design-system audit script syntax
        run: node --check tools/audit-muf-design-system.mjs

      - name: Run design-system source audit
        run: node tools/audit-muf-design-system.mjs

      - name: Verify the live workbench route and transformed modules
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/muf-vite.log"
          cd "$GITHUB_WORKSPACE/dairy_farm/client"
          npx vite --host 127.0.0.1 --port 5000 --strictPort >"$log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:5000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Dairy Vite did not become ready at http://127.0.0.1:5000/"
            cat "$log"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          npm run check-workbench-runtime

  visual-candidate:
    name: Visual regression (strict when baselines exist)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dairy_farm/client/package-lock.json
            flock_farm/client/package-lock.json
            agri_farm/frontend/package-lock.json

      - name: Install root test tools and Playwright
        run: npm ci

      - name: Install Dairy frontend dependencies
        working-directory: dairy_farm/client
        run: npm ci

      - name: Install Flock frontend dependencies
        working-directory: flock_farm/client
        run: npm ci

      - name: Install Agri frontend dependencies
        working-directory: agri_farm/frontend
        run: npm ci

      - name: Install Chromium headless shell and Linux dependencies
        run: npx playwright install --with-deps --only-shell chromium

      - name: Compare approved baselines or capture review candidates
        shell: bash
        run: |
          set -euo pipefail
          baseline_count=0
          if [ -d e2e/visual-baselines ]; then
            baseline_count="$(find e2e/visual-baselines -maxdepth 1 -type f -name '*.png' -print | wc -l | tr -d '[:space:]')"
          fi

          if [ "$baseline_count" -eq 0 ]; then
            echo "No committed PNG baselines found; capturing unapproved review candidates."
            npm run test:visual:update
          else
            echo "Found $baseline_count committed PNG baseline(s); strict visual comparison is required."
            npm run test:visual
          fi

      - name: Upload visual results, report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muf-visual-results-${{ github.sha }}
          path: |
            e2e/visual-baselines/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  frontend-builds:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: Dairy Farm
            path: dairy_farm/client
          - name: Flock Farm
            path: flock_farm/client
          - name: Agri Farm
            path: agri_farm/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install app dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci

      - name: Build app with its configured TypeScript/Vite command
        working-directory: ${{ matrix.app.path }}
        run: npm run build
