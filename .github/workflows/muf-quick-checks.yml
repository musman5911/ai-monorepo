name: MUF quick checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-checks:
    name: Tests and quick source checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dairy_farm/client/package-lock.json
            flock_farm/client/package-lock.json
            agri_farm/frontend/package-lock.json
            dairy_farm/backend/package-lock.json
            flock_farm/backend/package-lock.json
            agri_farm/backend/package-lock.json

      - name: Install root test tools
        run: npm ci

      - name: Install Dairy frontend dependencies used by root tests
        working-directory: dairy_farm/client
        run: npm ci

      - name: Install Agri backend dependencies for farm-scope checks
        working-directory: agri_farm/backend
        run: npm ci

      - name: Install Dairy backend dependencies for farm-scope checks
        working-directory: dairy_farm/backend
        run: npm ci

      - name: Install Flock backend dependencies for farm-scope checks
        working-directory: flock_farm/backend
        run: npm ci

      - name: Run root test suite (includes workflow contract test)
        run: npm test

      - name: Run Phase 19 database safety tests
        run: npm run check-final-db

      - name: Run Phase 19 read-only seed audit contract tests
        run: npm run check-phase19-audit

      - name: Check deterministic demo seeds and seeder syntax
        run: npm run check-seed

      - name: Check shared MUF parity
        run: npm run check-sync

      - name: Check UI safety
        run: npm run check-ui

      - name: Check workbench source safety
        run: npm run check-workbench

      - name: Check farm scope and Dairy breeding events
        run: npm run check-farms

      - name: Check phase documentation
        run: npm run check-docs

      - name: Check route inventory and server mounts
        run: npm run check-route-permissions

      - name: Check route role and farm matrix
        run: npm run check-route-matrix

      - name: Scan tracked files for secrets
        run: npm run check-secrets

      - name: Verify owner-only Super Admin and per-farm summaries
        run: npm run check-super-admin

      - name: Verify yearly archive flows in all three apps
        run: npm run check-archive

      - name: Audit production dependencies in all package sets
        run: npm run check-audit


  phase19-restored-copy-migrations:
    name: Phase 19 restored-copy farm migration (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: agri
            backend: agri_farm/backend
          - app: dairy
            backend: dairy_farm/backend
          - app: flock
            backend: flock_farm/backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: ${{ matrix.backend }}
        run: npm ci

      - name: Restore a fresh disposable backup and verify migrations twice
        working-directory: ${{ matrix.backend }}
        env:
          MUF_PHASE19_MIGRATION_APP: ${{ matrix.app }}
          MUF_PHASE19_MIGRATION_MONGO_URI: mongodb://127.0.0.1:27017
        run: node ../../tools/phase19-migration-mongo-integration.mjs

  flock-lock-multiprocess:
    name: Flock MongoDB cross-process egg lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install Flock backend dependencies
        working-directory: flock_farm/backend
        run: npm ci

      - name: Verify egg inventory lock across independent Node processes
        working-directory: flock_farm/backend
        env:
          MUF_PHASE19_FLOCK_LOCK_URI: mongodb://127.0.0.1:27017/muf_phase19_flock_lock_ci
          MUF_PHASE19_FLOCK_LOCK_FARM_ID: phase19-ci-farm
        run: node scripts/check-egg-inventory-lock-multiprocess.mjs
