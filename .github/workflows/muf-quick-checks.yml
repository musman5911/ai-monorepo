name: MUF quick checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-checks:
    name: Tests and quick source checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dairy_farm/client/package-lock.json
            flock_farm/client/package-lock.json
            agri_farm/frontend/package-lock.json
            dairy_farm/backend/package-lock.json
            flock_farm/backend/package-lock.json
            agri_farm/backend/package-lock.json

      - name: Install root test tools
        run: npm ci

      - name: Install Dairy frontend dependencies used by root tests
        working-directory: dairy_farm/client
        run: npm ci

      - name: Install Agri backend dependencies for farm-scope checks
        working-directory: agri_farm/backend
        run: npm ci

      - name: Install Dairy backend dependencies for farm-scope checks
        working-directory: dairy_farm/backend
        run: npm ci

      - name: Install Flock backend dependencies for farm-scope checks
        working-directory: flock_farm/backend
        run: npm ci

      - name: Run root test suite (includes workflow contract test)
        run: npm test

      - name: Run Phase 19 database safety tests
        run: npm run check-final-db

      - name: Check deterministic demo seeds and seeder syntax
        run: npm run check-seed

      - name: Check shared MUF parity
        run: npm run check-sync

      - name: Check UI safety
        run: npm run check-ui

      - name: Check workbench source safety
        run: npm run check-workbench

      - name: Check farm scope and Dairy breeding events
        run: npm run check-farms

      - name: Check phase documentation
        run: npm run check-docs

      - name: Check route inventory and server mounts
        run: npm run check-route-permissions

      - name: Check route role and farm matrix
        run: npm run check-route-matrix

      - name: Scan tracked files for secrets
        run: npm run check-secrets

      - name: Verify owner-only Super Admin and per-farm summaries
        run: npm run check-super-admin

      - name: Verify yearly archive flows in all three apps
        run: npm run check-archive

      - name: Audit production dependencies in all package sets
        run: npm run check-audit
